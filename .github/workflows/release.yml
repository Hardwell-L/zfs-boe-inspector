name: npm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'npm package version (SemVer)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: 校验 npm 发布版本
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm pack:npm
      - name: 使用 Trusted Publishing 发布 npm 包
        run: pnpm publish:npm
